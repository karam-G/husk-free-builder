name: Build private DroidOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-husk.yml

permissions:
  contents: read

concurrency:
  # Replace a stale/blocked build instead of leaving the repaired build queued.
  group: husk-private-build
  cancel-in-progress: true

jobs:
  build:
    # StikJIT requires Swift 6.4; the xcode-27 runner provides it.
    # Rebuild after restoring dependencies needed by remaining source references.
    # DroidOS: fast source/project checks before the native build; 60-minute hard limit.
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Check out helper
        uses: actions/checkout@v4

      - name: Check out private Husk source
        uses: actions/checkout@v4
        with:
          repository: karam-G/Husk-Audit
          ref: android-os-core
          token: ${{ secrets.HUSK_READ_TOKEN }}
          path: source
          submodules: recursive

      - name: Preflight source dependencies
        working-directory: source
        run: |
          set -euo pipefail
          grep -F '#include "husk-console-host.h"' src/app/Husk/HuskBridge.h
          grep -F 'husk_console_install_package' src/translation-layer-next/husk-console-host.h
          grep -F 'case .ps4' src/app/Husk/ConsoleUI.swift
          grep -F 'case ps4(PS4Game)' src/app/Husk/Launcher.swift
          grep -F 'case .ps4: return nil' src/app/Husk/Launcher.swift
          test -f src/app/Husk/PS4Screen.swift
          test -f src/translation-layer-next/husk-console-host.c
          echo "Source dependency preflight passed."

      - name: Fast source validation
        working-directory: source
        run: |
          set -euo pipefail
          swiftc -frontend -parse \
            src/app/Husk/ContentView.swift \
            src/app/Husk/BootScreen.swift \
            src/app/Husk/GuestImage.swift \
            src/app/Husk/HuskApp.swift \
            src/app/Husk/OnboardingView.swift
          plutil -lint src/app/Husk/Info.plist
          echo "Changed Swift files and Info.plist passed fast validation."

      - name: Verify Apple build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift --version | grep -F 'Swift version 6.4'
          xcrun --sdk iphoneos --show-sdk-version
          # Xcode 27 runner image does not necessarily include the Metal compiler.
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config meson ninja xcodegen cmake qemu
          command -v qemu-img
          qemu-img --version
          command -v python3
          python3 --version
          python3 -m pip install --target "$GITHUB_WORKSPACE/source/build/python" PyYAML
          meson --version
          ninja --version
          xcodegen --version

      - name: Validate generated Xcode project
        working-directory: source/src/app
        run: |
          set -euo pipefail
          xcodegen generate --quiet
          xcodebuild -list -project Husk.xcodeproj
          echo "Xcode project generation and scheme discovery passed."

      - name: Install Rust and iOS target
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build Husk
        working-directory: source
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          IPHONEOS_DEPLOYMENT_TARGET: "15.5"
          PYTHONPATH: ${{ github.workspace }}/source/build/python
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/output/DroidOS.ipa"

      - name: Encrypt IPA before upload
        if: success()
        env:
          HUSK_ARTIFACT_PASSWORD: ${{ secrets.HUSK_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HUSK_ARTIFACT_PASSWORD"
          mkdir -p output
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:HUSK_ARTIFACT_PASSWORD \
            -in output/DroidOS.ipa -out output/DroidOS.ipa.enc
          if [ -f output/DroidOS.tipa ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass env:HUSK_ARTIFACT_PASSWORD \
              -in output/DroidOS.tipa -out output/DroidOS.tipa.enc
          fi
          rm -f output/DroidOS.ipa output/DroidOS.tipa

      - name: Upload encrypted package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: droidos-encrypted-build-${{ github.run_number }}
          path: |
            output/*.enc
            source/build/logs/
            source/build/ios-arm64/logs/
          if-no-files-found: warn
          retention-days: 3
