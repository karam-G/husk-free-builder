name: Build private Husk IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-husk.yml

permissions:
  contents: read

concurrency:
  group: husk-private-build
  cancel-in-progress: false

jobs:
  build:
    # StikJIT requires Swift 6.4; the xcode-27 runner provides it.
    runs-on: xcode-27
    timeout-minutes: 360
    steps:
      - name: Check out helper
        uses: actions/checkout@v4

      - name: Check out private Husk source
        uses: actions/checkout@v4
        with:
          repository: karam-G/Husk-Audit
          ref: husk-windows-build
          token: ${{ secrets.HUSK_READ_TOKEN }}
          path: source
          submodules: recursive

      - name: Verify Apple build toolchain
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          swift --version | grep -F 'Swift version 6.4'
          xcrun --sdk iphoneos --show-sdk-version
          # Xcode 27 runner image does not necessarily include the Metal compiler.
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Install build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          set -euo pipefail
          brew install autoconf automake libtool pkg-config meson ninja xcodegen cmake qemu
          command -v qemu-img
          qemu-img --version
          command -v python3
          python3 --version
          python3 -m pip install --target "$GITHUB_WORKSPACE/source/build/python" PyYAML
          meson --version
          ninja --version
          xcodegen --version

      - name: Install Rust and iOS target
        run: |
          set -euo pipefail
          rustup update stable
          rustup default stable
          rustup target add aarch64-apple-ios
          rustc --version
          cargo --version

      - name: Build Husk
        working-directory: source
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          IPHONEOS_DEPLOYMENT_TARGET: "15.5"
          PYTHONPATH: ${{ github.workspace }}/source/build/python
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/ci_build.sh "$GITHUB_WORKSPACE/output/Husk.ipa"

      - name: Encrypt IPA before upload
        if: success()
        env:
          HUSK_ARTIFACT_PASSWORD: ${{ secrets.HUSK_ARTIFACT_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$HUSK_ARTIFACT_PASSWORD"
          mkdir -p output
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
            -pass env:HUSK_ARTIFACT_PASSWORD \
            -in output/Husk.ipa -out output/Husk.ipa.enc
          if [ -f output/Husk.tipa ]; then
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
              -pass env:HUSK_ARTIFACT_PASSWORD \
              -in output/Husk.tipa -out output/Husk.tipa.enc
          fi
          rm -f output/Husk.ipa output/Husk.tipa

      - name: Upload encrypted package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: husk-encrypted-build-${{ github.run_number }}
          path: |
            output/*.enc
            source/build/logs/
            source/build/ios-arm64/logs/
          if-no-files-found: warn
          retention-days: 3
